<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- Circular flow connection arrows -->
  <!-- Top-Right arrow: Knowledge -> Communities -->
  <path d="M290 120 C360 160 380 240 375 320" stroke="#0D5C4D" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="375" cy="320" r="5" fill="#0D5C4D" />

  <!-- Bottom arrow: Communities -> Nature -->
  <path d="M320 400 C250 430 190 420 155 375" stroke="#2B8282" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="155" cy="375" r="5" fill="#2B8282" />

  <!-- Left-Up arrow: Nature -> Knowledge -->
  <path d="M125 315 C110 230 145 155 200 115" stroke="#D96B27" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="200" cy="115" r="5" fill="#D96B27" />

  <!-- ── 01. KNOWLEDGE (Top) ── -->
  <g transform="translate(250, 95)">
    <!-- Circle badge -->
    <circle cx="0" cy="0" r="46" fill="#0D5C4D" />
    <!-- Curved Arc Text "KNOWLEDGE" -->
    <text x="0" y="-55" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" letter-spacing="0.16em" fill="#0D5C4D">
      KNOWLEDGE
    </text>
    <!-- Open Book Icon -->
    <g transform="translate(-20, -18) scale(1.6)" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </g>
  </g>

  <!-- ── 02. NATURE (Bottom Left) ── -->
  <g transform="translate(145, 360)">
    <!-- Circle badge -->
    <circle cx="0" cy="0" r="46" fill="#D96B27" />
    <!-- Label "NATURE" -->
    <text x="-55" y="18" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" letter-spacing="0.16em" fill="#D96B27" transform="rotate(-45, -55, 18)">
      NATURE
    </text>
    <!-- Plant / Leaves Sprout Icon -->
    <g transform="translate(-19, -18) scale(1.6)" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 20h10" />
      <path d="M10 20c0-5 2-9 7-10 0 4-2 8-7 10z" fill="#FFFFFF" fill-opacity="0.3"/>
      <path d="M14 15c0-4-2-7-6-8 0 3 2 6 6 8z" fill="#FFFFFF" fill-opacity="0.3"/>
    </g>
  </g>

  <!-- ── 03. COMMUNITIES (Bottom Right) ── -->
  <g transform="translate(355, 360)">
    <!-- Circle badge -->
    <circle cx="0" cy="0" r="46" fill="#2B8282" />
    <!-- Label "COMMUNITIES" -->
    <text x="55" y="18" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" letter-spacing="0.14em" fill="#2B8282" transform="rotate(45, 55, 18)">
      COMMUNITIES
    </text>
    <!-- People Collaboration Icon -->
    <g transform="translate(-20, -18) scale(1.6)" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
      <circle cx="9" cy="7" r="4" />
      <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
      <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    </g>
  </g>

  <!-- ── CENTER: ANTRABUMI EMBLEM ── -->
  <g transform="translate(210, 215)">
    <!-- Triangle Logo 'A' -->
    <path d="M40 8 L72 70 C73 72 71 75 68 75 L56 75 C54 75 52 74 51 72 L40 52 L29 72 C28 74 26 75 24 75 L12 75 C9 75 7 72 8 70 L40 8 Z" fill="#0D5C4D" />
    <path d="M18 62 C30 50 50 49 64 58 C55 65 38 66 23 72 Z" fill="#E5A823" />
    <path d="M25 56 C37 45 54 45 69 54 C57 59 42 60 29 65 Z" fill="#D96B27" />
    <path d="M40 28 L51 50 C44 46 36 46 29 50 L40 28 Z" fill="#FFFFFF" />
    <!-- Center text -->
    <text x="40" y="98" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" letter-spacing="0.18em" fill="#0A0A0A">
      ANTRABUMI
    </text>
  </g>
</svg>
