<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <!-- Outer circular segmented ring: Yellow/Amber, Orange, Green, Teal -->
  <circle cx="160" cy="160" r="140" stroke="#F5F5F4" stroke-width="20" fill="none" />
  
  <!-- Segment 1 (Orange): Nature & Grassroots -->
  <path d="M160 20 A140 140 0 0 1 300 160" stroke="#D96B27" stroke-width="20" stroke-linecap="round" fill="none" />
  
  <!-- Segment 2 (Teal): Knowledge & Collaboration -->
  <path d="M300 160 A140 140 0 0 1 160 300" stroke="#0D5C4D" stroke-width="20" fill="none" />
  
  <!-- Segment 3 (Yellow): Innovation & Voice -->
  <path d="M160 300 A140 140 0 0 1 20 160" stroke="#E5A823" stroke-width="20" fill="none" />

  <!-- Center Circle backdrop -->
  <circle cx="160" cy="160" r="105" fill="#FFFFFF" />

  <!-- Megaphone / Communication Icon (amplifying local voice) -->
  <g transform="translate(105, 110)">
    <!-- Megaphone Cone -->
    <path d="M45 25 L85 10 L85 65 L45 50 Z" fill="#0D5C4D" />
    <!-- Megaphone Body -->
    <rect x="25" y="25" width="20" height="25" rx="3" fill="#D96B27" />
    <!-- Handle -->
    <path d="M30 50 L35 75 L45 72 L40 50 Z" fill="#78350F" />
    <!-- Sound Waves -->
    <path d="M92 25 C98 32 98 43 92 50" stroke="#E5A823" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M99 18 C108 28 108 47 99 57" stroke="#0D5C4D" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- People Silhouette (Community) -->
  <g transform="translate(100, 200)">
    <!-- Person 1 (left) -->
    <circle cx="25" cy="10" r="8" fill="#2B8282" />
    <path d="M12 36 C12 28 18 23 25 23 C32 23 38 28 38 36 Z" fill="#2B8282" />
    <!-- Person 2 (center, prominent) -->
    <circle cx="60" cy="5" r="10" fill="#0D5C4D" />
    <path d="M44 38 C44 28 51 22 60 22 C69 22 76 28 76 38 Z" fill="#0D5C4D" />
    <!-- Person 3 (right) -->
    <circle cx="95" cy="10" r="8" fill="#D96B27" />
    <path d="M82 36 C82 28 88 23 95 23 C102 23 108 28 108 36 Z" fill="#D96B27" />
  </g>
</svg>
