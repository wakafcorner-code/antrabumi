<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" fill="none">
  <!-- OUR FRAMEWORK: 01 LISTEN, 02 CONNECT, 03 CO-CREATE, 04 ACT, 05 LEARN -->
  <!-- Dashed flow line -->
  <path d="M40 30 L40 250" stroke="#0D5C4D" stroke-width="2" stroke-dasharray="4 4" />

  <!-- 01 LISTEN -->
  <g transform="translate(40, 30)">
    <circle cx="0" cy="0" r="14" fill="#0D5C4D" />
    <path d="M-5 0 L-1 4 L6 -4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="5" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" letter-spacing="0.12em" fill="#0A0A0A">
      01 LISTEN
    </text>
  </g>

  <!-- 02 CONNECT -->
  <g transform="translate(40, 85)">
    <circle cx="0" cy="0" r="14" fill="#0D5C4D" />
    <path d="M-5 0 L-1 4 L6 -4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="5" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" letter-spacing="0.12em" fill="#0A0A0A">
      02 CONNECT
    </text>
  </g>

  <!-- 03 CO-CREATE -->
  <g transform="translate(40, 140)">
    <circle cx="0" cy="0" r="14" fill="#D96B27" />
    <path d="M-5 0 L-1 4 L6 -4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="5" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" letter-spacing="0.12em" fill="#0A0A0A">
      03 CO-CREATE
    </text>
  </g>

  <!-- 04 ACT -->
  <g transform="translate(40, 195)">
    <circle cx="0" cy="0" r="14" fill="#2B8282" />
    <path d="M-5 0 L-1 4 L6 -4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="5" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" letter-spacing="0.12em" fill="#0A0A0A">
      04 ACT
    </text>
  </g>

  <!-- 05 LEARN -->
  <g transform="translate(40, 250)">
    <circle cx="0" cy="0" r="14" fill="#0D5C4D" />
    <path d="M-5 0 L-1 4 L6 -4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="5" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" letter-spacing="0.12em" fill="#0A0A0A">
      05 LEARN
    </text>
  </g>
</svg>
